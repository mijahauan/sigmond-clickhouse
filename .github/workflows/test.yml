# Runs the sigmond-clickhouse test suite on every push to main and every PR.
#
# Tests inject a fake `_connect` so a real ClickHouse server is not
# needed in CI; we still install clickhouse-connect because the CLI
# module imports it at the top of _connect() (lazy, but the test
# fixtures bypass it).
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run pytest
        run: pytest -v
